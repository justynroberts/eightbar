<!DOCTYPE html>

<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ableton AI</title>
<script>
  // Applied before first paint so there is no flash of the wrong theme.
  try {
    var t = localStorage.getItem('ableton-ai-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    else document.documentElement.removeAttribute('data-theme');
  } catch (e) { document.documentElement.removeAttribute('data-theme'); }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="wordmark">ableton<span>_ai</span></div>

    <div class="status-row">
      <span class="chip"><span class="dot" id="dot-live"></span><span id="txt-live">live: probing</span></span>
      <span class="chip"><span class="dot on"></span><span id="txt-backend">backend: —</span></span>
      <span class="chip" id="chip-tempo">tempo: —</span>
      <span class="chip" id="chip-tracks">tracks: —</span>
    </div>

    <div class="controls">
      <button id="btn-refresh" title="Reload the set from Live">Refresh</button>
      <button id="btn-reset" title="Clear the conversation">Reset</button>
      <button id="btn-theme" aria-label="Switch colour theme">Theme</button>
      <button class="info-btn" id="btn-about" aria-label="About this app">i</button>
    </div>
  </header>

  <main class="panes">

    <section class="pane">
      <div class="pane-head"><span>Session log</span><span id="turn-count"></span></div>
      <div class="well" id="transcript"></div>

      <div class="examples" id="examples">
        <button>Create a rising chord progression in C minor</button>
        <button>Build me a dark rolling tech house loop at 128</button>
        <button>Arrange what I have into a 6 minute dance track</button>
        <button>Add a build-up and a riser into the first drop</button>
        <button>Make four variations of the drum loop</button>
        <button>Add placeholder tracks for vocals and FX</button>
      </div>

      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask for a progression, a loop, or a whole arrangement…"></textarea>
        <button class="send" id="btn-send">Send</button>
      </div>
    </section>

    <section class="pane">
      <div class="pane-head"><span>Set</span><span id="set-stamp"></span></div>
      <div class="well" id="setpanel">
        <p class="empty">Waiting for Ableton…</p>
      </div>
    </section>

  </main>
</div>

<dialog class="about" id="about">
  <div class="body">
    <h2>Ableton AI</h2>
    <p>Natural-language control of Ableton Live — generates MIDI, builds
       variations and arranges full tracks straight into your set.</p>
    <div class="row">
      <a href="https://fintonlabs.com" target="_blank" rel="noopener">Made by FintonLabs</a>
      <span class="ver">v0.1.0</span>
    </div>
    <div class="row" style="margin-top:16px">
      <span class="ver">Esc to close</span>
      <button id="btn-about-close">Close</button>
    </div>
  </div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
