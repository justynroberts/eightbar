[project]
name = "ableton-ai"
version = "0.1.0"
description = "Natural-language control of Ableton Live, driven by Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ableton-ai = "ableton_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
